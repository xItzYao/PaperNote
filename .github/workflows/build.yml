name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pdfkit-check:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check PDF text selection math
        run: swift Tests/pdf_selection_check.swift
      - name: Check circuit geometry
        run: |
          swiftc -O PaperNote/Model/CircuitData.swift Tests/CircuitCheck/main.swift -o circuit_check
          ./circuit_check

  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PaperNote.xcodeproj \
            -scheme PaperNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PaperNote.app Payload/
          zip -qry PaperNote.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaperNote-ipa
          path: PaperNote.ipa
