name: Build IPA

on:
  push:
    branches: [main, ink-engine]
  workflow_dispatch:

# 同一個分支又推了新的：舊的那次不用跑完（新的那次會跑一樣的測試）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdfkit-check:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check every UI string has an English translation
        run: python3 scripts/check_localization.py
      - name: Check PDF text selection math
        run: swift Tests/pdf_selection_check.swift
      - name: Check the last character on a line
        run: swift Tests/pdf_line_end_check.swift
      - name: Check circuit geometry
        run: |
          swiftc -O PaperNote/Model/CircuitData.swift PaperNote/Util/Localization.swift Tests/CircuitCheck/main.swift -o circuit_check
          ./circuit_check

  # 單元測試和 UI 測試分成兩個工作同時跑
  simulator-tests:
    name: simulator-tests (${{ matrix.bundle }})
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        bundle: [PaperNoteTests, PaperNoteUITests]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run tests on an iPad simulator
        run: |
          set -o pipefail
          # 取最新 iOS 版本裡的第一台 iPad 模擬器
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          devs = json.load(sys.stdin)["devices"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for k in sorted((k for k in devs if "iOS" in k), key=ver, reverse=True):
              for d in devs[k]:
                  if "iPad" in d["name"]:
                      print(d["udid"]); sys.exit()
          ')
          echo "Simulator: $UDID"
          # 編譯的時候先把模擬器開起來，等它完全開好才跑測試：
          # 剛開機的模擬器還在忙，UI 測試打開 App 會逾時（Failed to get background assertion）
          xcrun simctl bootstatus "$UDID" -b > boot.log 2>&1 &
          BOOT=$!
          FILTER="error:|Test Case .* (passed|failed)|XCTAssert|Executed|TEST (BUILD |EXECUTE )?(SUCCEEDED|FAILED)"
          xcodebuild build-for-testing \
            -project PaperNote.xcodeproj \
            -scheme PaperNote \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "$FILTER" || true
          grep -q "TEST BUILD SUCCEEDED" test.log
          wait $BOOT || true
          tail -3 boot.log
          xcodebuild test-without-building \
            -project PaperNote.xcodeproj \
            -scheme PaperNote \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -only-testing:${{ matrix.bundle }} \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee -a test.log | grep -E "$FILTER" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.bundle }}
          path: test.log

      # PencilKitInkStudy 畫出來的 PencilKit 筆跡（自製引擎照著調）
      - name: Upload PencilKit ink study
        if: always() && matrix.bundle == 'PaperNoteTests'
        uses: actions/upload-artifact@v4
        with:
          name: ink-study
          path: ~/ink-study
          if-no-files-found: ignore

  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Stamp build commit
        run: sed -i '' "s/\"dev\"/\"${GITHUB_SHA::7}\"/" PaperNote/Util/BuildInfo.swift

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PaperNote.xcodeproj \
            -scheme PaperNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PaperNote.app Payload/
          zip -qry PaperNote.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaperNote-ipa
          path: PaperNote.ipa
